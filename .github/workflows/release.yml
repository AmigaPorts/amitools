# Pushing a v* tag builds the sdist and wheel, checks them and publishes
# a GitHub release with both attached. The version comes from the tag
# through setuptools_scm, so the tag must be a PEP 440 version with a v
# prefix, e.g. v0.9.0. The test matrix in test.yml runs on the tag push
# as well.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm needs the tag history
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Check the tag against the built version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          wheel=$(ls dist/amitools-*.whl)
          version=${wheel#dist/amitools-}
          version=${version%%-*}
          if [ "$version" != "${TAG#v}" ]; then
            echo "tag $TAG does not match built version $version"
            exit 1
          fi

      - name: Smoke test the wheel
        run: |
          python -m pip install dist/amitools-*.whl
          xdftool --help >/dev/null
          hunktool --help >/dev/null
          romtool --help >/dev/null

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "amitools ${TAG#v}" --generate-notes
