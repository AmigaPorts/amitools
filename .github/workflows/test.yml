name: amitools GH Test

# Branches are tested through their pull request (merged with main), so
# a push only runs the matrix on main itself and on release tags.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-gh-actions
    - name: Test with tox
      run: tox -vvv
      env:
        PLATFORM: ${{ matrix.platform }}

  # sdist and wheel of this revision, so a pull request can be tried out
  # with "pip install <wheel>" before it is merged
  package:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        # setuptools_scm needs the tag history for the version
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        python -m twine check dist/*
    - name: Smoke test the wheel
      run: |
        python -m pip install dist/amitools-*.whl
        xdftool --help >/dev/null
        hunktool --help >/dev/null
        romtool --help >/dev/null
    - uses: actions/upload-artifact@v7
      with:
        name: amitools-dist
        path: dist/*
